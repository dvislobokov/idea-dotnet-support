settings.formatting.group=Formatting
settings.formatting.formatter=Formatter:
settings.formatting.comment=Behind Reformat Code and "Reformat code" of Actions on Save for C# files. Kept with the project: a team formats one way. Built-in: the whitespace rules of dotnet format by .editorconfig, worked out in the IDE as you go \u2014 Reformat Code, a selection, Auto-Indent Lines, a paste, without a process. dotnet format: whole files only, so it is felt on Reformat Code and on save (turn on "Reformat code" in Actions on Save); about a second per file, instant with the language server. Auto: CSharpier when the repository uses it (.csharpierrc or a tool manifest), otherwise the built-in formatter or dotnet format, as Formatting is set on the Language Server page. CSharpier formats whole files only.
settings.formatting.forProject=For this project: {0}
settings.formatting.csharpierMissing=CSharpier, but {0} Install it in .NET Tools above.
settings.formatting.dotnetFormat=dotnet format whitespace, from the SDK
settings.formatting.dotnetFormat.auto=dotnet format whitespace, from the SDK (no .csharpierrc, no csharpier in a tool manifest)
settings.formatting.builtIn=the built-in formatter: the rules of dotnet format whitespace, as you type
settings.formatting.none=Reformat Code leaves C# files alone.
formatter.AUTO=Auto
formatter.BUILT_IN=Built-in
formatter.CSHARPIER=CSharpier
formatter.DOTNET_FORMAT=dotnet format (on save)

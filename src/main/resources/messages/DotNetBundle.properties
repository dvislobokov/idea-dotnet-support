# The texts of the settings pages, English. The Russian ones are in DotNetBundle_ru.properties, with the same keys
# (DotNetBundleTest checks both ways). {0}, {1} are replaced as they are: an apostrophe is an apostrophe, nothing to double.
# The options of the language server have their English texts in RoslynOptions, and only the Russian ones in a file.


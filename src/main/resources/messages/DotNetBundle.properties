# Settings | .NET | ML completion (csharp-ml.xml, a build with -PmlEnabled=true; ml/CSharpMlConfigurable.kt)
page.ml=ML completion
ml.ranker.group=Completion list
ml.ranker.enabled=Rank completion candidates with the ML model
ml.ranker.enabled.comment=A language model of C# code and a ranker trained on the plugin's real completion lists order the popup (MRR 0.71 against 0.53 of the rules); off: the plugin's own order (expected type, kind, name)
ml.showMarker=Mark the rows ordered by the model
ml.showMarker.comment=A grey <code>ML</code> after every row the model scored; off: no visible difference
ml.status=Models:
ml.modelDirectory=Models directory:
ml.modelDirectory.comment=A directory with the files of <code>ml-models/csharp</code> (<code>e15-a.cml</code> and <code>e18-rank.cml</code> of the ranker, <code>cs31m-e2-lr2e3.cml</code>, <code>cs50m-e3-lr2e3.cml</code> and <code>cs-16384.bpe</code> of the network) from a newer training; empty: the models bundled in the plugin
ml.inline.group=Grey text (inline completion)
ml.inline.enabled=Suggest the rest of the line as grey text
ml.inline.enabled.comment=The bundled C# model proposes the end of the line after the caret; Tab accepts
ml.inline.bigModel=Use the big model (50 M parameters)
ml.inline.bigModel.comment=More exact lines (51.6 % against 50.2 %) for 1.7× the latency; only when the build or the models directory has <code>cs50m-e3-lr2e3.cml</code>
ml.inline.threshold=Confidence threshold:
ml.inline.threshold.comment=From 0.50 to 0.99: higher shows fewer, more certain suggestions (0.7: 14 % of positions, 94 % exact lines; 0.8: 10 %, 97 %)
ml.inline.dotThreshold=Confidence threshold after a dot:
ml.inline.dotThreshold.comment=After <code>.</code>, <code>?.</code>, <code>::</code>, <code>-></code> the model is as right but less sure among the members: 0.5 shows 30 % of such positions with 96 % exact lines
ml.inline.emptyLineThreshold=Confidence threshold on an empty line:
ml.inline.emptyLineThreshold.comment=After Enter the whole statement is a guess among a few: lower than the main threshold shows it
ml.inline.showClosers=Show suggestions that are only closing brackets
ml.inline.showClosers.comment=Off: a suggestion made only of <code>)</code>, <code>]</code>, <code>}</code>, <code>;</code> is hidden
ml.inline.guessStrings=Guess the text inside string literals
ml.inline.guessStrings.comment=The confidence gate counts the code only, so <code>throw new ArgumentException("…")</code> comes with a guessed message; off: the whole line must be certain
ml.inline.inStringsAndComments=Suggest inside strings and comments
ml.inline.inStringsAndComments.comment=Off: with the caret inside a string literal or a comment the model is not asked (it would guess prose); right after the closing quote it is code again
ml.inline.debugLog=Log every answer of the network
ml.inline.debugLog.comment=Text, confidence, threshold and whether it was shown, for each call — in .NET | Plugin Logs (category <code>ml</code>)
ml.nnStatus=Network:

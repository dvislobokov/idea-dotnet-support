# Settings | .NET | Analyzers and Generators (codeanalysis/CodeAnalysisConfigurable)
codeAnalysis.generators=Source Generators
codeAnalysis.runGenerators=Run source generators
codeAnalysis.runGenerators.comment=The generators of the project (regex, JSON, logging, packages) run on save and after a build; their files are under Dependencies → Analyzers, read-only, and what they declare resolves. Razor is not run
codeAnalysis.analyzers=Roslyn Analyzers
codeAnalysis.onSave=Run analyzers in the background on save
codeAnalysis.onSave.comment=The analyzers of the packages, the CA rules and the IDE rules of the SDK, with the severities of .editorconfig, on the saved file; for a whole project: .NET → Code Analysis → Run Code Analysis. Off while the language server is enabled: it runs them itself
codeAnalysis.suggestions=Show suggestions
codeAnalysis.suggestions.comment=Diagnostics of severity Info (IDE0290, CA1859…) as weak warnings, as the suggestions of Rider. Off: only warnings and errors are shown, the fixes of an Info are still on Alt+Enter at the caret; Run Code Analysis lists them in a collapsed group
codeAnalysis.idle=Stop the helper after minutes without requests:
codeAnalysis.idle.comment=One helper per solution (CodeAnalysisHelper, built with the SDK of the machine); it starts again at the next request


// What Grpc.Tools makes C# of at build time: obj/Debug/net9.0/Protos/Greet.cs (the messages) and GreetGrpc.cs (Greeter, its base and client).
// TYPE:grpc-stale — add the field `int32 age = 2;` to HelloRequest below and save. EXPECT: in Greeter.cs `request.Age` resolves within a few
// seconds (the helper makes the files again); until then the node «Generated by build» says «out of date». Ctrl+Z, save.
syntax = "proto3";

option csharp_namespace = "Playground.Grpc";

package greet;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}

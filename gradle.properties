pluginGroup = io.github.dotnetsupport
pluginVersion = 0.1.0

# IDE used for compilation, tests and `runIde`.
# If localIdePath points to an installed IDE it is used as is (nothing is downloaded),
# otherwise IntelliJ IDEA Community of platformVersion is downloaded.
platformVersion = 2025.1.3
localIdePath = C:/Program Files/JetBrains/GoLand 2025.1.3

kotlin.stdlib.default.dependency = false
# The build cache has restored test classes compiled against an older main source set more than once.
org.gradle.caching = false
org.gradle.configuration-cache = true

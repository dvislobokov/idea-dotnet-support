pluginGroup = io.github.dotnetsupport
pluginVersion = 0.1.0

# IDE used for compilation, tests and `runIde`.
# If localIdePath points to an installed IDE it is used as is (nothing is downloaded),
# otherwise IntelliJ IDEA of platformVersion is downloaded (since 2025.3 there is one distribution, no Community artifact).
platformVersion = 2026.1.4
localIdePath = C:/Program Files/JetBrains/IntelliJ IDEA 2026.1.4

kotlin.stdlib.default.dependency = false
# The build cache has restored test classes compiled against an older main source set more than once.
org.gradle.caching = false
org.gradle.configuration-cache = true
# The classpath of IntelliJ IDEA 2026.1 is several times the one of GoLand 2025.1: with the default heap the Kotlin daemon
# runs out of memory (GC overhead limit exceeded) in the middle of a full compilation.
kotlin.daemon.jvmargs = -Xmx3g
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8

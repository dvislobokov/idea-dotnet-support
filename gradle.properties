pluginGroup = io.github.dotnetsupport
pluginVersion = 0.1.152

# IDE used for compilation, tests and `runIde`: the public IntelliJ IDEA Community (user decision 2026-10-05) — no bundled plugins of the paid IDE.
# If localIdePath points to an installed IDE it is used as is (nothing is downloaded),
# otherwise IntelliJ IDEA of platformVersion is downloaded (since 2025.3 there is one distribution, no Community artifact).
platformVersion = 2026.1.4
localIdePath = C:/Program Files/JetBrains/IntelliJ IDEA Community Edition 2026.1.4

kotlin.stdlib.default.dependency = false
# The build cache has restored test classes compiled against an older main source set more than once.
org.gradle.caching = false
org.gradle.configuration-cache = true
# The classpath of IntelliJ IDEA 2026.1 is several times the one of GoLand 2025.1: with the default heap the Kotlin daemon
# runs out of memory (GC overhead limit exceeded) in the middle of a full compilation.
kotlin.daemon.jvmargs = -Xmx3g
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8

# csharp-psi (csharp-psi-core, docs/csharp-psi/PLAN.md "Roslyn pin"): the Roslyn commit the parser is ported from and checked against, the
# commit NuGet package Microsoft.CodeAnalysis.CSharp 5.9.0 was built from (tools/csharp-psi/roslyndump uses that package). No spaces
# around '=': tools/csharp-psi/*.sh and roslyndump read these lines literally.
roslynCommit=35d9211b841e7613c1d2f8f5af6d628ace696c4c
# The C# corpus beyond Roslyn's own sources (tools/csharp-psi/fetch-corpus.sh, into .corpus/runtime and .corpus/aspnetcore): the latest
# .NET 10 GA servicing tags at the time of pinning. Change both together with a rerun of the corpus gates.
runtimeTag=v10.0.12
aspnetcoreTag=v10.0.12
